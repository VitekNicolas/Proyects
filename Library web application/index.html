<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <header>
      <img src="./img/logo.jpg" alt="Logo" />
      <a class="nav" id="liHomePage" href="#">Home</a>
      <a class="nav" id="liCatalogPage" href="#">Catalogo</a>
      <a class="nav" id="liClientForm" href="#">Dejanos tu comentario</a>
      <div class="divBookCartContainer" hidden>
        <button class="cartBtn">
          🛒 Carrito <span id="cart-count">0</span>
        </button>
        <div class="cart-dropdown" id="cart-dropdown">
          <h3>Carrito</h3>
          <div class="divBookCart" id="cart-items"></div>
        </div>
      </div>
    </header>
    <div class="container">
      <aside class="aside">
        <div class="divFilterContainer" hidden>
          <div class="divFilterLang">
            <h3>Idioma</h3>
            <label
              ><input
                type="checkbox"
                class="inpLanguage"
                id="input"
                value="es"
              />Español</label
            >
            <label
              ><input
                type="checkbox"
                class="inpLanguage"
                id="input"
                value="en"
              />Inglés</label
            >
            <label
              ><input
                type="checkbox"
                class="inpLanguage"
                id="input"
                value="fr"
              />Francés</label
            >
            <label
              ><input
                type="checkbox"
                class="inpLanguage"
                id="input"
                value="it"
              />Italiano</label
            >
            <label
              ><input
                type="checkbox"
                class="inpLanguage"
                id="input"
                value="de"
              />Alemán</label
            >
          </div>
          <div class="divFilterCopyRight">
            <h3>Derechos de autor</h3>
            <label
              ><input type="checkbox" class="inptTrue" id="input" value="yes" />
              Si</label
            >
            <label
              ><input type="checkbox" class="inpFalse" id="input" value="no" />
              No</label
            >
          </div>
          <div class="divFilterYears">
            <h3>Rango de años</h3>
            <input class="input" id="inpMinYear" placeholder="Mínimo" />
            <input class="input" id="inpMaxYear" placeholder="Máximo" />
            <button class="btnSearchByAuthorYears">Buscar</button>
          </div>
          <div class="divFilterName">
            <h3>Nombre de autor</h3>
            <input class="input" id="inpAuthorName" placeholder="Nombre" />
            <button class="btnSearchByAuthorName">Buscar</button>
          </div>
          <div class="divFilterTopic">
            <h3>Tematica</h3>
            <input class="input" id="inpTopic" placeholder="Tematica" />
            <button class="btnSearchByTopic">Buscar</button>
          </div>
          <button class="btnReset">Resetear</button>
        </div>
        <div class="divAdContainer">
          <a
            href="https://www.yenny-elateneo.com/?srsltid=AfmBOoo3sdVX14UT4jvxgYKuzy5cG9q5ZsDUmQre2kTd9zsx5tQGPIle"
            target="_blank"
          >
            <img src="./img/banner1.jpg" alt="Publicidad 1" class="ad-banner" />
          </a>
          <a
            href="https://www.libreriamayorista.com.ar/index.php"
            target="_blank"
          >
            <img src="./img/banner2.jpg" alt="Publicidad 2" class="ad-banner" />
          </a>
          <a href="https://cuspide.com/" target="_blank">
            <img src="./img/banner3.jpg" alt="Publicidad 2" class="ad-banner" />
          </a>
          <a href="https://einsteinlibreria.com.ar/" target="_blank">
            <img src="./img/banner4.jpg" alt="Publicidad 2" class="ad-banner" />
          </a>
        </div>
      </aside>
      <main>
        <div class="cardsDiv"></div>
        <section class="carousel" hidden>
          <h2>Inspirado en lo último que viste</h2>
          <ul class="listBookSeen"></ul>
        </section>
        <div class="divPagination" hidden>
          <a href="#" data-page="back">&lsaquo; Atras</a>
          <a href="#" data-page="1">1</a>
          <a href="#" data-page="2">2</a>
          <a href="#" data-page="3">3</a>
          <a href="#" data-page="4">4</a>
          <a href="#" data-page="5">5</a>
          <a href="#" data-page="next">Siguiente &rsaquo;</a>
        </div>
      </main>
    </div>
  </body>
  <footer>
    <p>Derechos de autor &copy; 1991-2025&nbsp;</p>
    <a href="https://www.linkedin.com/in/nicolasvitek">Nicolas Vitek</a>
  </footer>
  <script type="module" src="./js/script.js"></script>
</html>
